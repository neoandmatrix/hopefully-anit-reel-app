name: Build APK

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Every build must use the same key, or Android refuses to install updates
      # over the existing app. So fail loudly instead of falling back to a debug key.
      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing (see README: Android app)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK (arm64)
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name "1.0.${{ github.run_number }}" \
            --build-number "${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/scroll-smart.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: scroll-smart-apk
          path: ${{ runner.temp }}/scroll-smart.apk

      # One rolling release, so the download link never changes:
      # https://github.com/<owner>/<repo>/releases/latest/download/scroll-smart.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "$RUNNER_TEMP/scroll-smart.apk" \
            --title "Scroll Smart 1.0.${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}. On your phone, download scroll-smart.apk and open it to install or update." \
            --target "$GITHUB_SHA" \
            --latest
